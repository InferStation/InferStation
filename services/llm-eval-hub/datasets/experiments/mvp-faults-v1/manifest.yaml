api_version: eval-dataset/v1
kind: Dataset
metadata:
  name: mvp-faults-v1
  display_name: Mvp Faults V1
  version: 1.0.0
  description: Deterministic MVP experiment fixture generated with seed 20260811.
  language:
  - zh-CN
  license: proprietary
  owner: ai-platform
  tags:
  - mvp
  - experiment
  - deterministic
data:
  format: jsonl
  path: data/test.jsonl
  split: test
  checksum_sha256: 0f978c167ef0f77a37897d238327253b027227d02ef7e445ccd5a1e094f5eae3
  id_field: id
  input_fields:
  - question
  reference_field: label
  metadata_fields:
  - fault_type
  - recovery
request:
  mode: chat_completions
  messages:
  - role: system
    content: 你是分类器。只能输出 billing、technical、account 之一。
  - role: user
    content: '{{ question }}'
  parameters:
    temperature: 0
    max_tokens: 8
    seed: 20260811
  stop: []
protocol:
  id: mvp-intent-chat-greedy-v1
  task_type: single_label_classification
  prediction_source: generated_text
  few_shot:
    count: 0
    selection: fixed
    sample_ids: []
  parser:
    type: label_set
    version: '1'
    labels:
    - billing
    - technical
    - account
    normalize:
    - trim
    - unicode_nfkc
    - lowercase
  scorer:
    type: classification
    version: '1'
    primary_metric: accuracy
    metrics:
    - accuracy
    - macro_f1
    - micro_f1
    - weighted_f1
  denominator_policy: all_scoring_samples
  on_api_error: exclude_and_report
  on_parse_error: count_as_incorrect
groups:
- field: fault_type
- field: recovery
validation:
  required_fields:
  - id
  - question
  - label
  unique_by:
  - id
  allowed_values:
    label:
    - billing
    - technical
    - account
    fault_type:
    - http_401
    - http_429
    - http_500
    - timeout
    - invalid_json
    - schema_mismatch
    - empty
    - parse_error
