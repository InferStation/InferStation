name: daily-bench

# Future GitHub-native replacement for the current 4090 crontab daily bench.
# The existing cron remains authoritative while this workflow is being brought up.
# Default mode is preview-only so the GitHub path can be validated on the bench
# runners without dispatching jobs or touching model-serving containers.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview only, or dispatch to the live admin API'
        type: choice
        default: preview
        options:
          - preview
          - dispatch
      trigger:
        description: 'dispatcher trigger value'
        type: choice
        default: nightly
        options:
          - nightly
          - manual
  schedule:
    # WEEKLY dry-run preview, ~30 min before the live weekly bench. Enable
    # dispatch only after the dispatcher URL/credentials are wired and the
    # crontab bench is retired.
    # Fri 22:30 UTC = Sat 06:30 CST, just before the Sat 07:00 CST weekly bench.
    - cron: '30 22 * * 5'

permissions:
  contents: read

env:
  INFERSTATION_UNITS_DIR: /home/amd/inferstation/admin_api/units

jobs:
  representative-daily-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: halo
            label: inferstation-halo
          - track: spark
            label: inferstation-spark
          - track: nv4090
            label: inferstation-nv4090
          - track: r9700
            label: inferstation-r9700
    runs-on:
      - self-hosted
      - inferstation-bench
      - ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Build representative daily request body on bench runner
        run: |
          set -euo pipefail
          echo "track=${{ matrix.track }} runner=$RUNNER_NAME arch=$(uname -m)"
          python3 scripts/daily-bench-gha.py --mode preview --trigger '${{ inputs.trigger || 'nightly' }}'

  representative-daily-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dispatch' }}
    runs-on:
      - self-hosted
      - inferstation-bench
      - inferstation-halo
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch representative daily bench
        env:
          INFERSTATION_DISPATCHER_URL: ${{ secrets.INFERSTATION_DISPATCHER_URL }}
          INFERSTATION_ADMIN_USER: ${{ secrets.INFERSTATION_ADMIN_USER }}
          INFERSTATION_ADMIN_PASS: ${{ secrets.INFERSTATION_ADMIN_PASS }}
        run: |
          set -euo pipefail
          python3 scripts/daily-bench-gha.py --mode dispatch --trigger '${{ inputs.trigger }}'
