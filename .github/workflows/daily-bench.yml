name: daily-bench

# Legacy representative-request preview only. The /admin dispatcher is retired;
# scheduled weekly benches run through bench-batch.yml directly on GitHub
# self-hosted bench runners.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview only; admin dispatch is retired'
        type: choice
        default: preview
        options:
          - preview
      trigger:
        description: 'dispatcher trigger value'
        type: choice
        default: nightly
        options:
          - nightly
          - manual
      scope:
        description: 'representative (62 weekly units) or all (full catalog sweep, multi-day)'
        type: choice
        default: representative
        options:
          - representative
          - all

permissions:
  contents: read

env:
  INFERSTATION_UNITS_DIR: /home/amd/inferstation/admin_api/units

jobs:
  representative-daily-preview:
    # Dry-run preview only on an explicit manual preview request.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: halo
            label: inferstation-halo
          - track: spark
            label: inferstation-spark
          - track: nv4090
            label: inferstation-nv4090
          - track: r9700
            label: inferstation-r9700
    runs-on:
      - self-hosted
      - inferstation-bench
      - ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Build representative daily request body on bench runner
        run: |
          set -euo pipefail
          echo "track=${{ matrix.track }} runner=$RUNNER_NAME arch=$(uname -m)"
          python3 scripts/daily-bench-gha.py --mode preview --trigger '${{ inputs.trigger || 'nightly' }}' --scope '${{ inputs.scope || 'representative' }}'
