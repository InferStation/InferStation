name: daily-bench

# Future GitHub-native replacement for the current 4090 crontab daily bench.
# The existing cron remains authoritative while this workflow is being brought up.
# Default mode is preview-only so the GitHub path can be validated without
# dispatching jobs or touching runners.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview only, or dispatch to the live admin API'
        type: choice
        default: preview
        options:
          - preview
          - dispatch
      trigger:
        description: 'dispatcher trigger value'
        type: choice
        default: nightly
        options:
          - nightly
          - manual
  schedule:
    # Dry-run preview after nightly build window. Enable dispatch only after the
    # dispatcher URL/credentials are wired and current crontab daily is retired.
    - cron: '30 16 * * *'

permissions:
  contents: read

env:
  INFERSTATION_UNITS_DIR: /home/amd/inferstation/admin_api/units

jobs:
  representative-daily-preview:
    runs-on: [self-hosted, cicd]
    steps:
      - uses: actions/checkout@v4
      - name: Build representative daily request body
        run: |
          set -euo pipefail
          python3 scripts/daily-bench-gha.py --mode preview --trigger '${{ inputs.trigger || 'nightly' }}'

  representative-daily-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dispatch' }}
    runs-on: [self-hosted, cicd]
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch representative daily bench
        env:
          INFERSTATION_DISPATCHER_URL: ${{ secrets.INFERSTATION_DISPATCHER_URL }}
          INFERSTATION_ADMIN_USER: ${{ secrets.INFERSTATION_ADMIN_USER }}
          INFERSTATION_ADMIN_PASS: ${{ secrets.INFERSTATION_ADMIN_PASS }}
        run: |
          set -euo pipefail
          python3 scripts/daily-bench-gha.py --mode dispatch --trigger '${{ inputs.trigger }}'
