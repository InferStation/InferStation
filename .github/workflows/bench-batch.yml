name: bench-batch

# Direct GitHub runner entrypoint for the current InferStation recipe runner.
# This does NOT use the retired /admin dispatcher. Each matrix job runs on the
# matching self-hosted bench runner and invokes scripts/run-all.sh, which drives
# scripts/bench-batch.py against bench/registry.yaml and pushes completed run
# JSONs back to the site.

on:
  schedule:
    # WEEKLY real bench. Fri 23:00 UTC = Sat 07:00 CST, ~8h after the
    # nightly-build image build. This is the authoritative scheduled bench;
    # it runs directly on GitHub self-hosted bench runners, no /admin dispatcher.
    - cron: '0 23 * * 5'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which weekly bench runner pool to use'
        type: choice
        default: all
        options:
          - all
          - halo
          - spark
          - nv4090
          - r9700
      filter:
        description: 'Optional bench-batch filter, e.g. minicpm5-2.6b:BF16'
        type: string
        default: ''
      scope:
        description: 'representative weekly set, or all expanded registry entries'
        type: choice
        default: all
        options:
          - representative
          - all
      keep_models:
        description: 'Keep downloaded models after the run'
        type: boolean
        default: true
      skip_push:
        description: 'Run without committing/pushing result JSONs'
        type: boolean
        default: false
      resume_existing:
        description: 'Skip successful results already present for this run date, all dates, or do not skip'
        type: choice
        default: date
        options:
          - none
          - date
          - any
      run_date:
        description: 'Optional UTC run_date for result paths, e.g. 2026-07-06. Empty = current UTC date.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: halo
            label: inferstation-halo3
            host: ryzen-ai-max-395-03
            shard_index: 0
            shard_count: 2
          - target: halo
            label: inferstation-halo4
            host: ryzen-ai-max-395-03
            shard_index: 1
            shard_count: 2
          - target: spark
            label: inferstation-spark2
            host: dgx-spark-01
            shard_index: 0
            shard_count: 2
          - target: spark
            label: inferstation-spark1
            host: dgx-spark-01
            shard_index: 1
            shard_count: 2
          - target: nv4090
            label: inferstation-nv4090-weekly
            host: rtx-4090-sh
            shard_index: 0
            shard_count: 1
          - target: r9700
            label: inferstation-r9700-weekly
            host: radeon-r9700-sh
            shard_index: 0
            shard_count: 1
    runs-on:
      - self-hosted
      - inferstation-bench
      - ${{ matrix.label }}
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: ghcr login (GHCR_PAT)
        if: ${{ (inputs.target || 'all') == 'all' || (inputs.target || 'all') == matrix.target }}
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          logged_in=0
          if docker version >/dev/null 2>&1; then
            printf '%s\n' "$GHCR_PAT" | docker login ghcr.io -u AlisaLi0 --password-stdin
            logged_in=1
          fi
          if sudo -n docker version >/dev/null 2>&1; then
            printf '%s\n' "$GHCR_PAT" | sudo -n docker login ghcr.io -u AlisaLi0 --password-stdin
            logged_in=1
          fi
          if [[ "$logged_in" -eq 0 ]]; then
            echo "neither docker nor sudo docker is usable on this runner" >&2
            exit 1
          fi
      - name: Run bench-batch directly
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BENCH_TARGET: ${{ inputs.target || 'all' }}
          BENCH_FILTER: ${{ inputs.filter || '' }}
          BENCH_SCOPE: ${{ inputs.scope || 'all' }}
          BENCH_RESUME_EXISTING: ${{ inputs.resume_existing || 'date' }}
          BENCH_RUN_DATE: ${{ inputs.run_date || '' }}
          KEEP_MODELS: ${{ github.event_name == 'schedule' || inputs.keep_models || false }}
          SKIP_PUSH: ${{ inputs.skip_push || false }}
        run: |
          set -euo pipefail
          if [[ -z "$BENCH_RUN_DATE" ]]; then
            export BENCH_RUN_DATE="$(date -u +%F)"
          fi
          if [[ "$BENCH_TARGET" != "all" && "$BENCH_TARGET" != "${{ matrix.target }}" ]]; then
            echo "skip target=${{ matrix.target }} because requested target=$BENCH_TARGET"
            exit 0
          fi
          args=()
          if [[ -n "$BENCH_FILTER" ]]; then
            prefixed=()
            IFS=',' read -ra filters <<< "$BENCH_FILTER"
            for f in "${filters[@]}"; do
              f="${f//[[:space:]]/}"
              [[ -n "$f" ]] && prefixed+=("${{ matrix.host }}:${f}")
            done
            args+=("--filter=$(IFS=,; echo "${prefixed[*]}")")
          else
            args+=("--filter=${{ matrix.host }}")
          fi
          args+=("--scope=$BENCH_SCOPE")
          args+=("--shard-index=${{ matrix.shard_index }}" "--shard-count=${{ matrix.shard_count }}")
          args+=("--resume-existing=$BENCH_RESUME_EXISTING")
          if [[ "$KEEP_MODELS" == "true" ]]; then
            args+=("--keep-models")
          fi
          if [[ "$SKIP_PUSH" == "true" ]]; then
            args+=("--skip-push" "--skip-push-site")
          fi
          echo "target=${{ matrix.target }} runner=${RUNNER_NAME} args=${args[*]:-<none>}"
          scripts/run-all.sh "${args[@]}"