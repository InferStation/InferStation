name: bench-batch

# Direct GitHub runner entrypoint for the current InferStation recipe runner.
# This does NOT use the retired /admin dispatcher. Each matrix job runs on the
# matching self-hosted bench runner and invokes scripts/run-all.sh, which drives
# scripts/bench-batch.py against bench/registry.yaml and pushes completed run
# JSONs back to the site.

on:
  schedule:
    # WEEKLY real bench. Fri 23:00 UTC = Sat 07:00 CST, ~8h after the
    # nightly-build image build. This is the authoritative scheduled bench;
    # it runs directly on GitHub self-hosted bench runners, no /admin dispatcher.
    - cron: '0 23 * * 5'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which weekly bench runner pool to use'
        type: choice
        default: all
        options:
          - all
          - halo
          - spark
          - nv4090
          - r9700
      filter:
        description: 'Optional bench-batch filter, e.g. minicpm5-2.6b:BF16'
        type: string
        default: ''
      scope:
        description: 'representative weekly set, or all expanded registry entries'
        type: choice
        default: all
        options:
          - representative
          - all
      keep_models:
        description: 'Keep downloaded models after the run'
        type: boolean
        default: false
      skip_push:
        description: 'Run without committing/pushing result JSONs'
        type: boolean
        default: false
      skip_push_site:
        description: 'Do not rsync each completed result to the site host; site sync can run separately'
        type: boolean
        default: true
      push_batch_size:
        description: 'Number of result files to batch before each git commit/push'
        type: string
        default: '20'
      resume_existing:
        description: 'Skip successful results already present for this run date, all dates, or do not skip'
        type: choice
        default: date
        options:
          - none
          - date
          - any
      run_date:
        description: 'Optional UTC run_date for result paths, e.g. 2026-07-06. Empty = current UTC date.'
        type: string
        default: ''
      gpu_device:
        description: 'Optional single NVIDIA GPU index. Only valid with target=nv4090.'
        type: string
        default: ''
      unsharded:
        description: 'Run the full filtered plan on each selected result host; normally pair with resume_existing=date.'
        type: boolean
        default: false
      request_timeout:
        description: 'Per-request timeout in seconds for long high-concurrency recovery runs.'
        type: string
        default: '1800'
      runner_label:
        description: 'Optional exact physical runner label for targeted recovery.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: halo
            label: inferstation-halo3
            host: ryzen-ai-max-395-03
            shard_index: 0
            shard_count: 2
          - target: halo
            label: inferstation-halo4
            host: ryzen-ai-max-395-03
            result_host: ryzen-ai-max-395-04
            shard_index: 1
            shard_count: 2
          - target: spark
            label: inferstation-spark2
            host: dgx-spark-01
            result_host: dgx-spark-02
            shard_index: 0
            shard_count: 2
          - target: spark
            label: inferstation-spark1
            host: dgx-spark-01
            shard_index: 1
            shard_count: 2
          - target: nv4090
            label: inferstation-nv4090-weekly
            host: rtx-4090-sh
            shard_index: 0
            shard_count: 1
          - target: r9700
            label: inferstation-r9700-weekly
            host: radeon-r9700-sh
            shard_index: 0
            shard_count: 1
    runs-on:
      - self-hosted
      - inferstation-bench
      - ${{ matrix.label }}
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Refresh NVIDIA CDI spec
        if: ${{ matrix.target == 'nv4090' && ((inputs.target || 'all') == 'all' || (inputs.target || 'all') == 'nv4090') }}
        run: |
          set -euo pipefail
          sudo -n install -d -m 0755 /etc/cdi
          sudo -n nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
          sudo -n nvidia-ctk cdi list | grep -qx 'nvidia.com/gpu=all'
      - name: ghcr login (GHCR_PAT)
        if: ${{ (inputs.target || 'all') == 'all' || (inputs.target || 'all') == matrix.target }}
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          logged_in=0
          if docker version >/dev/null 2>&1; then
            if printf '%s\n' "$GHCR_PAT" | docker login ghcr.io -u AlisaLi0 --password-stdin; then
              logged_in=1
            fi
          fi
          if sudo -n docker version >/dev/null 2>&1; then
            if printf '%s\n' "$GHCR_PAT" | sudo -n docker login ghcr.io -u AlisaLi0 --password-stdin; then
              logged_in=1
            fi
          fi
          if [[ "$logged_in" -eq 0 ]]; then
            echo "neither docker nor sudo docker is usable on this runner" >&2
            exit 1
          fi
      - name: Run bench-batch directly
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BENCH_GIT_PAT: ${{ secrets.GHCR_PAT }}
          BENCH_TARGET: ${{ inputs.target || 'all' }}
          BENCH_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
          BENCH_FILTER: ${{ inputs.filter || '' }}
          BENCH_SCOPE: ${{ inputs.scope || 'all' }}
          BENCH_RESUME_EXISTING: ${{ inputs.resume_existing || 'date' }}
          BENCH_RUN_DATE: ${{ inputs.run_date || '' }}
          BENCH_GPU_DEVICE: ${{ inputs.gpu_device || '' }}
          BENCH_REQUEST_TIMEOUT: ${{ inputs.request_timeout || '1800' }}
          BENCH_PUSH_BATCH_SIZE: ${{ inputs.push_batch_size || '20' }}
          BENCH_RESULT_HOST: ${{ matrix.result_host || '' }}
          BENCH_CLEANUP_ALL_MODELS: true
          SKIP_PUSH_SITE: ${{ inputs.skip_push_site }}
          KEEP_MODELS: ${{ inputs.keep_models || false }}
          SKIP_PUSH: ${{ inputs.skip_push || false }}
        run: |
          set -euo pipefail
          if [[ -n "$BENCH_RUNNER_LABEL" && "$BENCH_RUNNER_LABEL" != "${{ matrix.label }}" ]]; then
            echo "skip runner=${{ matrix.label }} because requested runner=$BENCH_RUNNER_LABEL"
            exit 0
          fi
          if [[ "$BENCH_TARGET" != "all" && "$BENCH_TARGET" != "${{ matrix.target }}" ]]; then
            echo "skip target=${{ matrix.target }} because requested target=$BENCH_TARGET"
            exit 0
          fi
          if [[ -n "$BENCH_GPU_DEVICE" && ( "$BENCH_TARGET" != "nv4090" || ! "$BENCH_GPU_DEVICE" =~ ^[0-9]+$ ) ]]; then
            echo "gpu_device requires target=nv4090 and a numeric GPU index" >&2
            exit 1
          fi
          if [[ -z "$BENCH_GIT_PAT" ]]; then
            echo "BENCH_GIT_PAT is required for long-running result pushes" >&2
            exit 1
          fi
          git_auth="$(printf 'x-access-token:%s' "$BENCH_GIT_PAT" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth"
          git push --dry-run origin HEAD:main
          echo "durable Git write authentication verified"
          if [[ -z "$BENCH_RUN_DATE" ]]; then
            export BENCH_RUN_DATE="$(date -u +%F)"
          fi
          args=()
          if [[ -n "$BENCH_FILTER" ]]; then
            prefixed=()
            IFS=',' read -ra filters <<< "$BENCH_FILTER"
            for f in "${filters[@]}"; do
              f="${f//[[:space:]]/}"
              [[ -n "$f" ]] && prefixed+=("${{ matrix.host }}:${f}")
            done
            args+=("--filter=$(IFS=,; echo "${prefixed[*]}")")
          else
            args+=("--filter=${{ matrix.host }}")
          fi
          args+=("--scope=$BENCH_SCOPE")
          if [[ "${{ inputs.unsharded || false }}" == "true" ]]; then
            args+=("--shard-index=0" "--shard-count=1")
          else
            args+=("--shard-index=${{ matrix.shard_index }}" "--shard-count=${{ matrix.shard_count }}")
          fi
          if [[ -n "${BENCH_RESULT_HOST:-}" ]]; then
            args+=("--result-host=$BENCH_RESULT_HOST")
          fi
          args+=("--resume-existing=$BENCH_RESUME_EXISTING")
          args+=("--push-batch-size=$BENCH_PUSH_BATCH_SIZE")
          if [[ "$KEEP_MODELS" == "true" ]]; then
            args+=("--keep-models")
          fi
          args+=("--cleanup-all-models")
          if [[ "$SKIP_PUSH" == "true" ]]; then
            args+=("--skip-push" "--skip-push-site")
          fi
          if [[ "${SKIP_PUSH_SITE:-true}" != "false" ]]; then
            args+=("--skip-push-site")
          fi
          echo "target=${{ matrix.target }} runner=${RUNNER_NAME} args=${args[*]:-<none>}"
          scripts/run-all.sh "${args[@]}"