name: nightly-build

# GitHub-native replacement for the Gitea .gitea/workflows/build-and-push.yml.
#
# Scope of THIS workflow: build the device images on cicd and push them to
# GitHub Container Registry (ghcr.io/inferstation). Test-node consumption
# (who pulls what, when) is OUT OF SCOPE here — handled by the dispatcher.
#
# Design:
#   - one self-hosted runner on cicd (128c/503G, x86) builds the x86 families
#     by cross-compiling per gfx arch (no GPU needed at build time):
#       halo  -> gfx1151,  nv4090 -> cuda,  r9700 -> gfx1201
#   - spark images are arm64 (DGX Spark GB10), so build-spark mirrors upstream
#     arm64 images on the x86 cicd box with docker pull --platform.
#   - ghcr auth uses the GHCR_PAT repo secret (a PAT with write:packages): the
#     pre-existing ghcr.io/inferstation/* packages were created by that PAT, and
#     the built-in GITHUB_TOKEN lacks write access to them (permission_denied:
#     write_package). INFERSTATION_REGISTRY=ghcr.io/inferstation +
#     INFERSTATION_FORCE_LOCAL_BUILD=1 make daily.sh/build.sh build locally on the
#     runner and push to ghcr.
#
# Triggers: WEEKLY @ Beijing Fri 23:00 (Fri 15:00 UTC) + manual workflow_dispatch.
# (The weekly bench runs Sat 07:00 CST = Fri 23:00 UTC ~8h later, SAME UTC date
#  (Fri), so it finds this build's nightly-<Fri-UTC> tag — no cross-midnight gap.)

on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:
    inputs:
      tracks:
        description: 'Which build tracks to run'
        type: choice
        default: all
        options:
          - all
          - radeon-base
          - halo
          - halo-runtime
          - nv4090
          - r9700
          - spark

permissions:
  contents: read         # checkout only; ghcr push uses the GHCR_PAT secret (see above)

env:
  # cicd builds/mirrors everything locally and pushes to ghcr (not Harbor).
  INFERSTATION_REGISTRY: ghcr.io/inferstation   # build.sh redirects <name> here
  INFERSTATION_FORCE_LOCAL_BUILD: '1'           # build on the runner, no SSH pool
  INFERSTATION_GHCR_MODE: '1'                    # skip Harbor dedup; always build/mirror

jobs:
  build-radeon-base:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tracks == 'all' || inputs.tracks == 'radeon-base' || inputs.tracks == 'halo' || inputs.tracks == 'r9700' }}
    runs-on: [self-hosted, cicd]
    steps:
      - uses: actions/checkout@v4
      - name: ghcr login (GHCR_PAT)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u AlisaLi0 --password-stdin
      - name: build Radeon PyTorch/ROCm bases on cicd -> ghcr
        working-directory: dockerfiles
        env:
          TRIGGER: ${{ github.event_name }}
          TRACKS: ${{ inputs.tracks }}
        run: |
          set -e
          chmod +x build.sh daily.sh prune.sh
          if [[ "$TRIGGER" == "workflow_dispatch" && "$TRACKS" == "halo" ]]; then
            ./daily.sh halo-base
          else
            ./daily.sh radeon-base
          fi

  build-halo:
    needs: [build-radeon-base]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tracks == 'all' || inputs.tracks == 'halo' }}
    runs-on: [self-hosted, cicd]
    steps:
      - uses: actions/checkout@v4
      - name: ghcr login (GHCR_PAT)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u AlisaLi0 --password-stdin
      - name: build halo (gfx1151) on cicd -> ghcr
        working-directory: dockerfiles
        env:
          TRIGGER: ${{ github.event_name }}
          TRACKS: ${{ inputs.tracks }}
        run: |
          set -e
          chmod +x build.sh daily.sh prune.sh
          if [[ "$TRIGGER" == "workflow_dispatch" && "$TRACKS" == "halo" ]]; then
            ./daily.sh halo-vllm
          else
            ./daily.sh halo
          fi

  build-halo-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tracks == 'halo-runtime' }}
    runs-on: [self-hosted, cicd]
    steps:
      - uses: actions/checkout@v4
      - name: ghcr login (GHCR_PAT)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u AlisaLi0 --password-stdin
      - name: assemble patched halo runtime on cicd -> ghcr
        working-directory: dockerfiles
        env:
          CANDIDATE_TAG: runtime-${{ github.sha }}
          BASE_REF: ghcr.io/inferstation/pytorch-rocm-halo:multiarch-7.15.0a20260719-gfx1151
          WHEEL_REF: ghcr.io/inferstation/vllm-wheel-halo-gfx11:gfx11-gfx1151
        run: |
          set -euo pipefail
          chmod +x build.sh
          base_digest=$(docker buildx imagetools inspect --raw "$BASE_REF" | sha256sum | awk '{print $1}')
          wheel_digest=$(docker buildx imagetools inspect --raw "$WHEEL_REF" | sha256sum | awk '{print $1}')
          docker pull "${WHEEL_REF}@sha256:${wheel_digest}" >/dev/null
          wheel_container=$(docker create "${WHEEL_REF}@sha256:${wheel_digest}" true)
          trap 'docker rm -f "$wheel_container" >/dev/null 2>&1 || true' EXIT
          if docker cp "$wheel_container:/commit.txt" /tmp/wheel-commit.txt 2>/dev/null; then
            wheel_revision=$(cat /tmp/wheel-commit.txt)
          else
            # Migration exception for the one pre-provenance wheel. Never infer
            # a revision from a mutable tag or metadata alone.
            legacy_digest=eae68b65bc69c465c32d89bae098253ff9f1e0cfcbb59855f5b49538fa96c904
            legacy_revision=965d21822d144724d95fa5fdbe51baf41e42e05d
            [[ "$wheel_digest" == "$legacy_digest" ]] || {
              echo "wheel sha256:${wheel_digest} has no commit.txt and is not the known legacy wheel" >&2
              exit 1
            }
            wheel_revision=$legacy_revision
            echo "using verified legacy wheel mapping sha256:${wheel_digest} -> ${wheel_revision}"
          fi
          [[ "$wheel_revision" =~ ^[0-9a-f]{40}$ ]]
          echo "base=${BASE_REF}@sha256:${base_digest}"
          echo "wheel=${WHEEL_REF}@sha256:${wheel_digest}"
          echo "vllm_revision=${wheel_revision}"
          ./build.sh vllm-rocm-halo \
            --ref=gfx11 \
            --tag="${CANDIDATE_TAG:0:20}" \
            --build-arg "VLLM_BASE=${BASE_REF}@sha256:${base_digest}" \
            --build-arg "WHEEL_IMAGE=${WHEEL_REF}@sha256:${wheel_digest}" \
            --build-arg "VLLM_REVISION=${wheel_revision}" \
            --no-latest \
            --fail-if-exists

  build-nv4090:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tracks == 'all' || inputs.tracks == 'nv4090' }}
    runs-on: [self-hosted, cicd]
    steps:
      - uses: actions/checkout@v4
      - name: ghcr login (GHCR_PAT)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u AlisaLi0 --password-stdin
      - name: build nv4090 (cuda) on cicd -> ghcr
        working-directory: dockerfiles
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          set -e
          chmod +x build.sh daily.sh prune.sh
          ./daily.sh nv4090

  build-r9700:
    needs: [build-radeon-base]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tracks == 'all' || inputs.tracks == 'r9700' }}
    runs-on: [self-hosted, cicd]
    steps:
      - uses: actions/checkout@v4
      - name: ghcr login (GHCR_PAT)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u AlisaLi0 --password-stdin
      - name: build r9700 (gfx1201) on cicd -> ghcr
        working-directory: dockerfiles
        env:
          TRIGGER: ${{ github.event_name }}
          INFERSTATION_SKIP_RADEON_BASE: '1'
        run: |
          set -e
          chmod +x build.sh daily.sh prune.sh
          ./daily.sh r9700

  # spark NVIDIA images now MIRROR official upstream (verified on GB10/sm121), so
  # cicd (x86) produces the arm64 image via `docker pull --platform`. No arm64 runner.
  build-spark:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tracks == 'all' || inputs.tracks == 'spark' }}
    runs-on: [self-hosted, cicd]
    steps:
      - uses: actions/checkout@v4
      - name: ghcr login (GHCR_PAT)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u AlisaLi0 --password-stdin
      - name: mirror spark images (arm64) on cicd -> ghcr
        working-directory: dockerfiles
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          set -e
          chmod +x build.sh daily.sh prune.sh
          ./daily.sh spark

  verify-halo-runtime:
    needs: [build-halo-runtime]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.tracks == 'halo-runtime' }}
    runs-on: [self-hosted, cicd]
    steps:
      - name: assert isolated halo runtime candidate exists in ghcr
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          test "${{ needs.build-halo-runtime.result }}" == "success"
          printf '%s\n' "$GHCR_PAT" | docker login ghcr.io -u AlisaLi0 --password-stdin
          tag="runtime-${GITHUB_SHA:0:12}"
          docker buildx imagetools inspect "ghcr.io/inferstation/vllm-rocm-halo:${tag}" >/dev/null
          echo "verified ghcr.io/inferstation/vllm-rocm-halo:${tag}"

  verify:
    needs: [build-radeon-base, build-spark, build-halo, build-nv4090, build-r9700]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, cicd]
    steps:
      - name: assert today's nightly tags exist in ghcr (fail loudly if a build silently produced nothing)
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -e
          DATE=$(date -u +%Y%m%d)
          echo "verify nightly-${DATE} for spark/halo/nv4090/r9700 repos under ghcr.io/inferstation"
          echo "radeon-base=${{ needs.build-radeon-base.result }} spark=${{ needs.build-spark.result }} halo=${{ needs.build-halo.result }} nv4090=${{ needs.build-nv4090.result }} r9700=${{ needs.build-r9700.result }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "manual workflow_dispatch builds intentionally do not move nightly-* tags; skipping nightly tag verification"
            exit 0
          fi

          test "${{ needs.build-radeon-base.result }}" == "success"
          test "${{ needs.build-spark.result }}"  == "success"
          test "${{ needs.build-halo.result }}"   == "success"
          test "${{ needs.build-nv4090.result }}" == "success"
          test "${{ needs.build-r9700.result }}"  == "success"

          if [[ -z "${GHCR_PAT:-}" ]]; then
            echo "GHCR_PAT is empty; cannot verify private/internal ghcr packages" >&2
            exit 1
          fi

          repos=(
            llama-cuda-spark
            vllm-cuda-spark
            llama-vulkan-spark
            pytorch-rocm-halo
            llama-rocm-halo
            vllm-rocm-halo-main
            vllm-rocm-halo
            llama-vulkan-halo
            llama-cuda-4090
            vllm-cuda-4090
            llama-vulkan-4090
            pytorch-rocm-r9700
            pytorch-rocm-w7900
            vllm-rocm-w7900-main
            llama-rocm-r9700
            vllm-rocm-r9700-main
            llama-vulkan-r9700
          )
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          failed=0
          for repo in "${repos[@]}"; do
            token=$(curl -fsSL -u "AlisaLi0:${GHCR_PAT}" "https://ghcr.io/token?scope=repository:inferstation/${repo}:pull&service=ghcr.io" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token", ""))')
            if [[ -z "$token" ]]; then
              echo "MISSING token for ${repo}" >&2
              failed=1
              continue
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: ${accept}" \
              "https://ghcr.io/v2/inferstation/${repo}/manifests/nightly-${DATE}")
            if [[ "$code" == "200" ]]; then
              echo "OK ${repo}:nightly-${DATE}"
            else
              echo "MISSING ${repo}:nightly-${DATE} (HTTP ${code})" >&2
              failed=1
            fi
          done
          exit "$failed"
