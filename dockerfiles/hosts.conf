# InferStation build-host roster — MAINTAINED LIST (not auto-discovered).
#
# This is the authoritative candidate pool per arch family. build.sh reads it to
# decide where a profile MAY build; at runtime it picks the first reachable +
# idle host here (see pick_idle_host). Liveness/idle is probed at runtime, so do
# NOT prune a host just because it is temporarily down — keep the roster stable
# and flip `enabled` instead.
#
# Format (whitespace-separated):
#   <family>  <host_alias>  <enabled>  # notes
#     family      : spark | halo   (arch-bound; builds never cross families)
#     host_alias  : the alias as configured on the relay host
#                   amd@10.161.176.110 (~/.ssh/config there). NOT the
#                   docs/ssh `-shanghai` names. The relay does: ssh <alias> ...
#     enabled     : 1 = candidate, 0 = excluded (kept for history/roster)
#
# Requirements for an enabled host (verified 2026-06-05):
#   - alias resolvable on the relay (amd@10.161.176.110 ~/.ssh/config)
#   - correct arch/accelerator: spark = aarch64 + NVIDIA GB10 (sm_121);
#                                halo  = x86_64 + AMD Strix Halo (gfx1151)
#   - root docker daemon reachable (build.sh runs `sudo docker`)
#   - root docker logged in to Harbor 10.161.176.38:8443 (else push 401)
#
# To add a host: configure its alias on the relay, `sudo docker login
# 10.161.176.38:8443` as root on it, then add a line here with enabled=1.

# family   alias    enabled   # notes
spark      spark1   1         # aarch64, NVIDIA GB10, docker+harbor OK (primary)
spark      spark2   1         # 2nd DGX Spark; intermittently offline (No route) but keep in roster — runtime probe skips it when down
halo       halo6    0         # TEMP-DISABLED 2026-06-18..~06-21: running spark-arena DiffusionGemma verification (86GB RAM in use) — a build here would OOM-crash it. Re-enable to 1 after verification.
halo       halo5    1         # x86_64, gfx1151, docker+harbor OK
# Single-host families below: family_of_host() does NOT pool these (returns ""),
# so build.sh uses the pinned meta build_host directly via lkang's ssh config
# (run_on 4090|9700x8 cases) — NOT the amd@.110 relay. Listed here for the roster.
nv4090     4090     1         # x86_64, NVIDIA RTX 4090 (sm_89) = the dispatcher box itself (10.161.176.110); builds llama-cuda-4090
r9700      9700x8   1         # x86_64, AMD Radeon AI PRO R9700 (gfx1201), 10.161.176.149; builds llama-rocm-r9700
