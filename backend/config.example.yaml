server:
  host: "0.0.0.0"
  port: 8080

jwt:
  secret_key: "CHANGE-ME-TO-A-RANDOM-SECRET"
  algorithm: "HS256"
  access_token_expire_minutes: 1440  # 24h

admin:
  username: "admin"
  password: "admin123"
  email: "admin@llm-gateway.local"

pricing:
  default:
    input: 1.0    # 元/百万 token
    output: 3.0

health_check:
  interval_seconds: 30

# Freemius MoR for one-time topups (USD). Leave 'enabled: false' to skip.
# webhook URL on dashboard:  https://<gateway>/api/payments/freemius/webhook
# Product type on dashboard MUST be 'SaaS / Web App' (avoid +2.3% WP surcharge).
# Each preset must point to a one-time plan with billing_cycle=lifetime.
payments:
  freemius:
    enabled: false
    sandbox: true
    product_id: "29647"
    product_public_key: ""     # pk_xxxxxxxxxx
    product_secret: ""         # sk_xxxxxxxxxx — signs webhooks (x-signature)
    developer_secret: ""       # legacy signing fallback (optional)
    api_bearer: ""             # REST API auth (refunds / cancellations)
    presets:
      starter:  { usd_cents: 2000,  plan_id: "48779", pricing_id: "63580", label: "$20" }
      standard: { usd_cents: 10000, plan_id: "48781", pricing_id: "63581", label: "$100" }
      pro:      { usd_cents: 50000, plan_id: "48782", pricing_id: "63582", label: "$500" }
