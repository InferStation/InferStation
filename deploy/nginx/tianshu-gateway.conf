server {
    include /etc/nginx/snippets/shared-ip-blacklist-enforce.conf;
    server_name tianshu-gateway.cloud www.tianshu-gateway.cloud;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    access_log /var/log/nginx/tianshu-gateway.access.log cfcombined;
    access_log /var/log/nginx/aop-rollout.log aop_test;
    error_log  /var/log/nginx/tianshu-gateway.error.log;
    server_tokens off;

    if ($host = www.tianshu-gateway.cloud) {
        return 301 https://tianshu-gateway.cloud$request_uri;
    }

    # Security headers (applied to all responses from this server).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API / WS / healthz: NOT locked
    location = /api/auth/login {
        limit_req zone=tianshu_login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }
    location /v1/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==== baize-mirror (public, NOT locked) ====
    # 白泽桌面端拉 agent 二进制 / index.json 用；后续会迁到 baize 自家域名
    location /baize-mirror/ {
        alias /var/www/baize-mirror/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        types {
            application/json json;
            application/zip zip;
            application/x-tar tar;
            application/gzip tar.gz tgz;
            application/x-xz tar.xz txz;
            application/octet-stream exe bin;
        }
        default_type application/octet-stream;
        sendfile on;
        tcp_nopush on;
        client_max_body_size 0;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # 大文件下载允许较长
        proxy_read_timeout 3600s;
    }


    # security.txt (RFC 9116) — public, NOT locked
    location = /.well-known/security.txt {
        alias /var/www/latex-tools/.well-known/security.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
    }

        # /admin UI gated by HTTP basic-auth (defense in depth; API itself is also bearer-auth)
    location /admin {
        auth_basic "tianshu-admin";
        auth_basic_user_file /etc/nginx/.htpasswd-tianshu-admin;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Site is open; access control is enforced by the app (invite + login).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 503 = @maint;
    location @maint {
        root /var/www/tianshu-maint;
        try_files /index.html =503;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tianshu-gateway.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tianshu-gateway.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
}

server {
    include /etc/nginx/snippets/shared-ip-blacklist-enforce.conf;
    if ($host = tianshu-gateway.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name tianshu-gateway.cloud www.tianshu-gateway.cloud;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    access_log /var/log/nginx/tianshu-gateway.access.log cfcombined;
    error_log  /var/log/nginx/tianshu-gateway.error.log;
    return 404; # managed by Certbot
}
